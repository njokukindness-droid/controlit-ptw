function urlB64ToUint8(b64) {
  var pad = "=".repeat((4 - b64.length % 4) % 4);
  var raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  var arr = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}

function showLocalNotification(title, body, url) {
  if (!("serviceWorker" in navigator)) return;
  if (Notification.permission !== "granted") return;
  navigator.serviceWorker.ready.then(function(reg) {
    reg.showNotification(title, {
      body: body,

// ── Account Setup ─────────────────────────────────────────────────────────────
function AccountSetup({session,onComplete}){

  async function save(){
    if(!fullName.trim()){setErr("Enter your full name.");return;}if(newPass.length<8){setErr("Password min 8 chars.");return;}if(newPass!==confirm){setErr("Passwords do not match.");return;}
    setBusy(true);setErr("");const r=await sb.updatePassword(session.token,newPass);if(r.error){setErr(r.error.message||"Failed.");setBusy(false);return;}
    await sb.update(session.token,"profiles",`id=eq.${session.userId}`,{full_name:fullName});onComplete({...session,profile:{...session.profile,full_name:fullName}});setBusy(false);

  return(
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#0F2640 0%,#1A3A5C 60%,#0E4D38 100%)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"2rem"}}>
      <div style={{marginBottom:"2rem",textAlign:"center"}}><svg width="56" height="56" viewBox="0 0 32 32" fill="none" style={{marginBottom:12}}><rect width="32" height="32" rx="8" fill={B.accent}/><path d="M8 16 L14 22 L24 10" stroke="#fff" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/><circle cx="16" cy="16" r="10" stroke="#fff" strokeWidth="1.5" fill="none" opacity="0.4"/></svg><div style={{color:B.white,fontWeight:800,fontSize:26,letterSpacing:"0.06em"}}>CONTROLIT</div><div style={{color:"rgba(255,255,255,0.55)",fontSize:13,marginTop:4}}>Complete account setup</div></div>
      <div style={{background:"rgba(255,255,255,0.07)",backdropFilter:"blur(12px)",border:"0.5px solid rgba(255,255,255,0.15)",borderRadius:16,padding:"2rem",width:"100%",maxWidth:380}}>
        <p style={{color:"rgba(255,255,255,0.8)",fontSize:13,marginBottom:"1.25rem",fontWeight:500}}>Welcome to <strong style={{color:B.accent}}>{session.org.name}</strong>. Set your name and a secure password.</p>
        {err&&<div style={{background:"rgba(192,57,43,0.2)",border:"0.5px solid rgba(192,57,43,0.5)",borderRadius:8,padding:"8px 12px",marginBottom:12,fontSize:12,color:"#ffaaaa"}}>{err}</div>}
        <div style={{marginBottom:12}}><label style={{fontSize:11,color:"rgba(255,255,255,0.55)",display:"block",marginBottom:4}}>Full name *</label><input value={fullName} onChange={e=>setFullName(e.target.value)} style={{background:"rgba(255,255,255,0.1)",border:"0.5px solid rgba(255,255,255,0.2)",color:B.white,borderRadius:8}}/></div>
        <div style={{marginBottom:12}}><label style={{fontSize:11,color:"rgba(255,255,255,0.55)",display:"block",marginBottom:4}}>New password *</label><input type="password" value={newPass} onChange={e=>setNewPass(e.target.value)} style={{background:"rgba(255,255,255,0.1)",border:"0.5px solid rgba(255,255,255,0.2)",color:B.white,borderRadius:8}}/></div>
        <div style={{marginBottom:"1.5rem"}}><label style={{fontSize:11,color:"rgba(255,255,255,0.55)",display:"block",marginBottom:4}}>Confirm password *</label><input type="password" value={confirm} onChange={e=>setConfirm(e.target.value)} style={{background:"rgba(255,255,255,0.1)",border:"0.5px solid rgba(255,255,255,0.2)",color:B.white,borderRadius:8}}/></div>
        <button onClick={save} disabled={busy} style={{width:"100%",background:busy?"#555":B.accent,color:B.white,border:"none",borderRadius:8,padding:"12px",fontSize:14,fontWeight:700,cursor:busy?"not-allowed":"pointer"}}>{busy?"Saving…":"Complete setup & sign in"}</button>

// ── Change Password ───────────────────────────────────────────────────────────
function ChangePassword({session,onBack}){
  const[c,setC]=useState("");const[n,setN]=useState("");const[cn,setCn]=useState("");const[busy,setBusy]=useState(false);const[err,setErr]=useState("");const[ok,setOk]=useState(false);
  async function save(){
    if(!c){setErr("Enter current password.");return;}if(n.length<8){setErr("Min 8 chars.");return;}if(n!==cn){setErr("Passwords do not match.");return;}if(n===c){setErr("Must differ from current.");return;}
    setBusy(true);setErr("");const chk=await sb.signIn(session.profile.email,c);if(chk.error){setErr("Current password incorrect.");setBusy(false);return;}
    const r=await sb.updatePassword(session.token,n);if(r.error){setErr(r.error.message||"Failed.");setBusy(false);return;}setOk(true);setBusy(false);
  }
  return(<div><Topbar title="Change Password" onBack={onBack}/><div style={{padding:"1.25rem"}}>{ok?(<div style={{textAlign:"center",padding:"2rem"}}><div style={{fontSize:48,marginBottom:16}}>✓</div><p style={{fontSize:16,fontWeight:600,color:B.text,marginBottom:8}}>Password updated</p><button onClick={onBack} style={{background:B.accent,color:"#fff",border:"none",borderRadius:8,padding:"10px 24px",fontSize:13,fontWeight:600,cursor:"pointer"}}>Back</button></div>):(<><div style={{background:B.neutral,border:`0.5px solid ${B.neutralBorder}`,borderRadius:10,padding:"10px 14px",marginBottom:"1rem"}}><p style={{fontSize:12,color:B.textSub}}>Signed in as <strong>{session.profile.email}</strong></p></div>{err&&<ErrBox msg={err}/>}<div style={{display:"flex",flexDirection:"column",gap:12}}><div><label style={{fontSize:12,color:B.textSub,display:"block",marginBottom:4}}>Current password *</label><input type="password" value={c} onChange={e=>setC(e.target.value)}/></div><div><label style={{fontSize:12,color:B.textSub,display:"block",marginBottom:4}}>New password *</label><input type="password" value={n} onChange={e=>setN(e.target.value)}/></div><div><label style={{fontSize:12,color:B.textSub,display:"block",marginBottom:4}}>Confirm new *</label><input type="password" value={cn} onChange={e=>setCn(e.target.value)}/></div></div><button onClick={save} disabled={busy} style={{marginTop:"1.5rem",width:"100%",background:busy?"#999":B.primary,color:"#fff",border:"none",borderRadius:8,padding:"12px",fontSize:13,fontWeight:700,cursor:busy?"not-allowed":"pointer"}}>{busy?"Updating…":"Update password"}</button></>)}</div></div>);
}

// ── Dashboard (Cockpit) ───────────────────────────────────────────────────────
function Dashboard({session,permits,loading,error,onSelect,onNew,onNotifs,unread,onAdmin,onWorkflow,onRegister,onChangePass,onLogout}){
  const[filter,setFilter]=useState("all");
  const counts={
    active:permits.filter(p=>p.status==="active").length,
    pending:permits.filter(p=>p.status==="pending"||p.status==="extension_pending").length,
    revoked:permits.filter(p=>p.status==="revoked").length,
    closed:permits.filter(p=>p.status==="closed").length,
    expired:permits.filter(p=>p.status==="expired").length
  };
  const filtered=filter==="all"?permits:permits.filter(p=>p.status===filter||(filter==="pending"&&p.status==="extension_pending"));

  // Donut chart — rendered once after mount
  React.useEffect(()=>{
    if(typeof Chart==="undefined")return;
    const canvas=document.getElementById("cockpit-donut");
    if(!canvas)return;
    if(canvas._chartInstance)canvas._chartInstance.destroy();
    const typeCounts={};
    permits.forEach(p=>{const t=pt(p.type);typeCounts[t.label||p.type]=(typeCounts[t.label||p.type]||0)+1;});
    const labels=Object.keys(typeCounts);
    const data=Object.values(typeCounts);
    const palette=["#0E9E6E","#E24B4A","#378ADD","#EDA100","#7F77DD","#1BAFA7","#EB6834"];
    canvas._chartInstance=new Chart(canvas,{
      type:"doughnut",
      data:{labels,datasets:[{data,backgroundColor:palette.slice(0,labels.length),borderWidth:2,borderColor:"rgba(10,20,40,0.9)",hoverOffset:4}]},
      options:{responsive:false,cutout:"68%",plugins:{legend:{display:false},tooltip:{enabled:true}},animation:{animateRotate:true,duration:900}}
    });
  },[permits]);

  // Starfield — rendered once on mount
  React.useEffect(()=>{

  const typeBreakdown=(()=>{
    const map={};

    return Object.entries(map).sort((a,b)=>b[1]-a[1]);
  })();
  const palette=["#0E9E6E","#E24B4A","#378ADD","#EDA100","#7F77DD","#1BAFA7","#EB6834"];

  const alertColor=s=>s==="revoked"||s==="rejected"?"#E24B4A":s==="expired"?"#888":"#0E9E6E";
  const alertLabel=s=>s==="revoked"?"Revoked":s==="rejected"?"Rejected":s==="expired"?"Expired":"Closed";

  const timeAgo=ts=>{
    if(!ts)return"";

    if(d===0)return"today";

  const badgeStyle=status=>{

            <div className="cp-rail-section">
              <div className="cp-rail-title">Permits by Status</div>
              {(()=>{
                const R=50,r=33,cx=62,cy=62;
                const statusSlices=[
                  {key:"active",label:"Active",val:counts.active,color:"#00FFB2"},
                  {key:"pending",label:"Pending",val:counts.pending,color:"#EDA100"},
                  {key:"closed",label:"Closed",val:counts.closed,color:"#4A9EFF"},
                  {key:"revoked",label:"Revoked",val:counts.revoked,color:"#E24B4A"},
                  {key:"expired",label:"Expired",val:counts.expired,color:"#555"},
                ].filter(s=>s.val>0);
                const totalSlice=statusSlices.reduce((a,s)=>a+s.val,0)||1;
                const gap=totalSlice>1?0.04:0;
                let angle=-Math.PI/2;
                const paths=statusSlices.map(s=>{
                  const sweep=(s.val/totalSlice)*2*Math.PI-gap;
                  const a1=angle+gap/2,a2=a1+sweep;
                  angle+=sweep+gap;
                  const x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
                  const x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2);
                  const x3=cx+r*Math.cos(a2),y3=cy+r*Math.sin(a2);
                  const x4=cx+r*Math.cos(a1),y4=cy+r*Math.sin(a1);
                  const lg=sweep>Math.PI?1:0;
                  return{...s,d:`M${x1},${y1} A${R},${R} 0 ${lg},1 ${x2},${y2} L${x3},${y3} A${r},${r} 0 ${lg},0 ${x4},${y4} Z`};
                });

                  <div className="cp-rail-ring-wrap">
                    <div style={{position:"relative",width:124,height:124,flexShrink:0}}>
                      <svg width="124" height="124" viewBox="0 0 124 124">
                        <circle cx={cx} cy={cy} r={(R+r)/2} fill="none" stroke="rgba(255,255,255,0.04)" strokeWidth={R-r}/>
                        {paths.length>0?paths.map((p,i)=>(
                          <path key={i} d={p.d} fill={p.color} opacity="0.9"><title>{p.label}: {p.val}</title></path>
                        )):(
                          <circle cx={cx} cy={cy} r={(R+r)/2} fill="none" stroke="rgba(255,255,255,0.07)" strokeWidth={R-r}/>
                        )}
                      </svg>
                      <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",pointerEvents:"none"}}>
                        <span style={{fontFamily:"'DM Mono',monospace",fontSize:24,fontWeight:500,color:"#fff",lineHeight:1}}>{total}</span>

                    <div className="cp-rail-legend">
                      {[

                        {label:"Closed",val:counts.closed,color:"#4A9EFF"},

                          <span style={{fontSize:10,color:"rgba(255,255,255,0.4)",flex:1}}>{label}</span>
                          <span style={{fontFamily:"'DM Mono',monospace",fontSize:10,color:"rgba(255,255,255,0.7)",fontWeight:500}}>{val}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })()}
            </div>

            {/* Recent activities */}
            <div className="cp-rail-section" style={{flex:1,overflowY:"auto"}}>
              <div className="cp-rail-title">Recent Activities</div>
              {[...permits].sort((a,b)=>new Date(b.updated_at||b.created_at)-new Date(a.updated_at||a.created_at)).slice(0,8).map((p,i,arr)=>{
                const t=pt(p.type);
                const ac=alertColor(p.status);
                return(
                  <div key={p.id} onClick={()=>onSelect(p)} style={{display:"flex",alignItems:"flex-start",gap:8,padding:"8px 0",borderBottom:i<arr.length-1?"1px solid rgba(255,255,255,0.04)":"none",cursor:"pointer"}}>
                    <div style={{width:6,height:6,borderRadius:"50%",background:ac,flexShrink:0,marginTop:4,boxShadow:`0 0 4px ${ac}88`}}/>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:10,color:"rgba(255,255,255,0.7)",marginBottom:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.title}</div>
                      <div style={{fontSize:9,color:"rgba(255,255,255,0.3)"}}>{p.permit_number} · {t.label||p.type}</div>
                    </div>
                    <div style={{fontSize:9,color:"rgba(255,255,255,0.2)",flexShrink:0,whiteSpace:"nowrap"}}>{timeAgo(p.updated_at||p.created_at)}</div>
                  </div>
                );
              })}
              {permits.length===0&&<div style={{fontSize:10,color:"rgba(255,255,255,0.2)",textAlign:"center",padding:"12px 0"}}>No permits yet</div>}
            </div>
          </div>

        </div>{/* end cp-body */}

        {/* ── Live Feed Bar ── */}
        <div className="cp-livefeed">
          <span className="cp-livefeed-label">LIVE FEED</span>
          <div className="cp-livefeed-scroll">
            {permits.length>0?(
              <div className="cp-livefeed-inner">
                {[...permits,...permits].slice(0,20).map((p,i)=>(
                  <span key={i} className="cp-livefeed-item">
                    <span className="cp-livefeed-time">{timeAgo(p.updated_at||p.created_at)}</span>
                    {p.permit_number} — {(p.status||"").replace("_"," ")} · {p.area||p.title}

            ):(

            )}
          </div>
        </div>

      </div>{/* end cockpit-hud */}
    </div>
  );
}

function NewPermit({session,onBack,onSuccess}){
  const isMarine=session&&session.org&&session.org.sector==="marine";
  const[type,setType]=useState("");const[title,setTitle]=useState("");const[area,setArea]=useState("");const[requester,setRequester]=useState(session.profile.full_name);const[supervisor,setSupervisor]=useState("");const[numPersons,setNumPersons]=useState("");
  // Vessel area selector (marine only)
  const[vesselZone,setVesselZone]=useState("");
  const[vesselSubLocation,setVesselSubLocation]=useState("");
  const[vesselName,setVesselName]=useState("");
  // Gas test readings — confined space + marine permits
  const GAS_TEST_TYPES=["confined_space","marine_hot_work","marine_confined_space","gas_free_certificate","diving_operations"];
  const needsGasTest=GAS_TEST_TYPES.includes(type);
  const[gasO2,setGasO2]=useState("");
  const[gasLEL,setGasLEL]=useState("");
  const[gasCO,setGasCO]=useState("");
  const[gasH2S,setGasH2S]=useState("");
  const[gasTested,setGasTested]=useState(false);
  const[gasTestedBy,setGasTestedBy]=useState("");
  // Marine gas test extras
  const[gasInstrument,setGasInstrument]=useState("");
  const[gasSerialNo,setGasSerialNo]=useState("");
  const[gasTestDate,setGasTestDate]=useState("");
  const[gasTestTime,setGasTestTime]=useState("");
  const[gasRetestInterval,setGasRetestInterval]=useState("4");
  const[gasFreeRef,setGasFreeRef]=useState(""); // Gas Free Cert reference number

  async function submit(){

      vessel_zone:isMarine?vesselZone||null:null,
      vessel_name:isMarine?vesselName||null:null,
      ra_mode:raMode,ra_generated:raGenerated||null,ra_file_name:raFile?raFile.name:null,ra_file_data:raMode==="upload"?raFileData:null,work_date_from:workDateFrom,work_date_to:workDateTo,work_time_from:workTimeFrom,work_time_to:workTimeTo,num_persons:numPersons,simops_conflicts:simopsWarnings.length>0?simopsWarnings.map(p=>({id:p.id,permit_number:p.permit_number,type:p.type,title:p.title,area:p.area})):null,workers:workers.length>0?workers:null};
    const res=await sb.insert(session.token,"permits",{org_id:session.profile.org_id,permit_number:num,type,title,area,requester_name:requester,supervisor_name:supervisor,status:"pending",stage:1,priority:"medium",extensions:0,form_data:fd});

// ── Permit Detail ─────────────────────────────────────────────────────────────
function PermitDetail({permit:init,session,onBack,onRefresh}){
  const[tab,setTab]=useState("detail");const[audit,setAudit]=useState([]);const[permit,setPermit]=useState(init);const[busy,setBusy]=useState(false);const[errMsg,setErrMsg]=useState("");const[rejectReason,setRejectReason]=useState("");const[showRejectBox,setShowRejectBox]=useState(false);const[oshControls,setOshControls]=useState((init.form_data?.osh_additional_controls)||"");const[extDateTo,setExtDateTo]=useState("");const[showExtForm,setShowExtForm]=useState(false);;const[aiSuggesting,setAiSuggesting]=useState(false);const[checklistDone,setChecklistDone]=useState(()=>{
    // Pre-tick checklist if permit already issued (restore saved state)
    if(init.form_data&&init.form_data.issuer_checklist)return init.form_data.issuer_checklist;
    return {};
  });const[showChecklist,setShowChecklist]=useState(false);const[showPDF,setShowPDF]=useState(false);
  const t=pt(permit.type);const fd=permit.form_data||{};
  function loadAudit(){sb.select(session.token,"permit_audit",`permit_id=eq.${permit.id}&order=created_at.asc`).then(d=>{if(Array.isArray(d))setAudit(d);});}
  useEffect(()=>{loadAudit();},[permit.id]);

  const checklistItems=[...(fd.selected_controls||[]).filter(c=>c!=="RA Required"),...(fd.osh_additional_controls?fd.osh_additional_controls.split("\n").filter(s=>s.trim()):[])];
  const allChecked=checklistItems.length>0&&checklistItems.every(c=>checklistDone[c]);
  const isOSH=(session.profile.role==="safety_officer"||session.profile.role==="admin")&&permit.stage===2&&permit.status==="pending";
  const isIssuer=(session.profile.role==="issuer"||session.profile.role==="admin")&&permit.stage===3&&permit.status==="pending";

  async function getAI(){
    if(!session.apiKey){setErrMsg("AI not configured.");return;}setAiSuggesting(true);setErrMsg("");
    try{const sel=(fd.selected_controls||[]).filter(c=>c!=="RA Required");const text=await callClaude(session.apiKey,"You are a senior HSE safety officer. Recommend additional control measures as a numbered list, one per line. Specific to the permit type and work described. No preamble, no markdown, just the numbered list.",`Permit Type: ${t.label}\nWork: ${permit.title}\nArea: ${permit.area}\nExisting controls:\n${sel.join("\n")}\n\nRecommend 5-8 additional specific controls.`);setOshControls(prev=>(prev?prev+"\n":"")+text.trim());}catch(e){setErrMsg("AI error: "+e.message);}
    setAiSuggesting(false);
  }

  async function action(act){
    setErrMsg("");const role=session.profile.role;const isAdmin=role==="admin";

    // ── Comprehensive role-action guards ─────────────────────────────
    // Approve: only AA (stage 1), OSH (stage 2), or admin
    if(act==="approve"&&!isAdmin){
      const exp=ROLE_STAGE[role];
      if(exp===undefined){setErrMsg("Your role is not authorised to approve permits.");return;}
      if(permit.stage!==exp){setErrMsg("This permit is not yet at your stage for approval.");return;}
    }
    // Reject: only AA (stage 1), OSH (stage 2), or admin — same as approve
    if(act==="reject"&&!isAdmin){
      const exp=ROLE_STAGE[role];
      if(exp===undefined){setErrMsg("Your role is not authorised to reject permits.");return;}
      if(permit.stage!==exp){setErrMsg("This permit is not at your stage — you cannot reject it.");return;}
      if(!rejectReason.trim()){setErrMsg("Provide a rejection reason.");return;}
    }
    if(act==="reject"&&isAdmin&&!rejectReason.trim()){setErrMsg("Provide a rejection reason.");return;}
    // Issue: only issuer or admin, only at stage 3
    if(act==="issue"&&!isAdmin&&role!=="issuer"){setErrMsg("Only the Issuer can issue a permit.");return;}
    if(act==="issue"&&permit.stage!==3&&!isAdmin){setErrMsg("Permit must be OSH-approved before issuance.");return;}
    if(act==="issue"&&!allChecked){setErrMsg("Complete all site verification checklist items before issuing.");return;}
    // Work complete: only requester or admin
    if(act==="work_complete"&&!isAdmin&&role!=="requester"){setErrMsg("Only the Work In-charge can sign off work completion.");return;}
    // Close: only issuer or admin
    if(act==="close"&&!isAdmin&&role!=="issuer"){setErrMsg("Only the Issuing Authority can close a permit.");return;}
    // Suspend: only issuer or admin
    if(act==="suspend"&&!isAdmin&&role!=="issuer"){setErrMsg("Only the Issuing Authority can suspend a permit.");return;}
    // Extension request: only requester or admin
    if(act==="ext_request"&&!isAdmin&&role!=="requester"){setErrMsg("Only the Work In-charge can request an extension.");return;}
    // Extension approve/reject: only admin or HSE (safety_officer) — never the requester who raised it
    if((act==="ext_approve"||act==="ext_reject")&&!isAdmin&&role!=="safety_officer"){setErrMsg("Only Admin or HSE can approve or reject extensions.");return;}
    // ─────────────────────────────────────────────────────────────────
    setBusy(true);
    let ns=permit.status,st=permit.stage,ex=permit.extensions||0;const extra={};
    if(act==="approve"){if(role==="safety_officer"||permit.stage===2)extra.form_data={...fd,osh_additional_controls:oshControls,checklist_generated:true};st=Math.min(permit.stage+1,4);ns=st===4?"active":"pending";}
    else if(act==="issue"){st=4;ns="active";extra.issued_by=session.userId;extra.issued_at=nowStr();extra.form_data={...fd,issuer_checklist:checklistDone,issued_by_name:session.profile.full_name};}
    else if(act==="reject"){ns="rejected";extra.form_data={...fd,rejection_reason:rejectReason,rejected_by:session.profile.full_name,rejected_at:nowStr()};}
    else if(act==="work_complete"){ns="work_complete";extra.form_data={...fd,work_completed_by:session.profile.full_name,work_completed_at:nowStr()};}
    else if(act==="suspend")ns="revoked";
    else if(act==="close"){ns="closed";extra.closed_at=nowStr();}
    else if(act==="ext_request"){
      ns="extension_pending";
      if(extDateTo)extra.form_data={...fd,work_date_to:extDateTo,ext_requested_date:extDateTo};
    }
    else if(act==="ext_approve"){
      ns="active";ex=(permit.extensions||0)+1;
      if(fd.ext_requested_date)extra.form_data={...fd,work_date_to:fd.ext_requested_date};
    }
    else if(act==="ext_reject")ns="active";
    const labels={approve:"Approved & forwarded",issue:"Permit issued",reject:"Rejected",suspend:"Permit suspended",close:"Permit closed",work_complete:"Work completion signed off",ext_request:"Extension requested",ext_approve:"Extension approved",ext_reject:"Extension rejected"};
    const nevt={approve:permit.stage===2?"osh_approved":"aa_approved",issue:"issued",reject:"rejected",suspend:"suspended",close:"closed",work_complete:"closed",ext_request:"ext_requested",ext_approve:"ext_approved",ext_reject:"ext_rejected"};
    await sb.update(session.token,"permits",`id=eq.${permit.id}`,{status:ns,stage:st,extensions:ex,...extra});
    await sb.insert(session.token,"permit_audit",{org_id:session.profile.org_id,permit_id:permit.id,user_id:session.userId,user_name:session.profile.full_name,user_role:roleLabel(role),action:labels[act]||act,note:rejectReason||""});
    await sb.notify(session.token,session.profile.org_id,permit.id,permit.permit_number,permit.title,nevt[act]||act,session.profile.full_name);
    // Show local push notification for the actor (same device)
    const pushMsgs={approve:"Permit approved and forwarded",issue:"Permit issued — work may commence",reject:"Permit rejected",suspend:"Permit suspended",close:"Permit closed",work_complete:"Work completion signed off",ext_request:"Extension requested",ext_approve:"Extension approved"};
    showLocalNotification("CONTROLIT — "+permit.permit_number,pushMsgs[act]||"Permit updated","/app.html");
    // Send cross-device push to all other org members
    const evtMap={approve:permit.stage===2?"osh_approved":"aa_approved",issue:"issued",reject:"rejected",suspend:"suspended",close:"closed",work_complete:"work_complete",ext_request:"ext_requested",ext_approve:"ext_approved",ext_reject:"ext_rejected"};
    sendCrossDevicePush(session.profile.org_id,permit.permit_number,permit.title,evtMap[act]||act,session.userId);

    setPermit({...permit,status:ns,stage:st,extensions:ex,...extra});setRejectReason("");setShowRejectBox(false);loadAudit();await onRefresh();setBusy(false);
  }

        {permit.status==="active"&&fd.work_date_to&&(()=>{

                        {w.competencies&&w.competencies[comp]?"✓ ":""}{comp}
                      </span>
                    ))}
                  </div>
                </div>
              );
            })}
          </Card>)}
          {(permit.stage>=2||fd.osh_additional_controls)&&(<Card title="Additional Controls — OSH Manager" accent={isOSH?B.accent:undefined}>
          {isOSH?(<><p style={{fontSize:11,color:B.textSub,marginBottom:8}}>Add additional controls. Use AI for suggestions specific to this permit.</p><textarea value={oshControls} onChange={e=>setOshControls(e.target.value)} placeholder={"Additional controls (one per line)…"} rows={5} style={{resize:"vertical",marginBottom:8}}/>{session.apiKey?<button onClick={getAI} disabled={aiSuggesting} style={{width:"100%",background:aiSuggesting?"#999":B.primary,color:"#fff",border:"none",borderRadius:8,padding:"9px",fontSize:12,fontWeight:600,cursor:aiSuggesting?"not-allowed":"pointer",marginBottom:4}}>{aiSuggesting?"🤖 Getting recommendations…":"🤖 Get AI-recommended additional controls"}</button>:<p style={{fontSize:11,color:B.warn}}>⚠ AI not configured.</p>}</>):(fd.osh_additional_controls?<p style={{fontSize:13,color:B.text,lineHeight:1.7,whiteSpace:"pre-wrap"}}>{fd.osh_additional_controls}</p>:<p style={{fontSize:12,color:B.textSub}}>No additional controls added yet.</p>)}
        </Card>)}

        {(isIssuer||permit.stage>=3||permit.status==="active"||permit.status==="closed")&&checklistItems.length>0&&(<Card title="Site Verification Checklist" accent={isIssuer?B.accentBorder:undefined}>
          {isIssuer&&<p style={{fontSize:11,color:B.warn,marginBottom:8}}>Verify every control is in place on site. All items must be confirmed before issuing.</p>}
          <button onClick={()=>setShowChecklist(!showChecklist)} style={{width:"100%",background:showChecklist?B.neutral:B.primary,color:showChecklist?B.text:"#fff",border:`0.5px solid ${B.neutralBorder}`,borderRadius:8,padding:"9px",fontSize:12,fontWeight:600,cursor:"pointer",marginBottom:showChecklist?10:0}}>{showChecklist?"▲ Hide checklist":"▼ Tap to reveal site verification checklist"}</button>
          {showChecklist&&(<div>
            {checklistItems.map((c,i)=>(<label key={i} style={{display:"flex",gap:10,alignItems:"flex-start",padding:"8px 0",borderBottom:`0.5px solid ${B.neutralBorder}`,cursor:isIssuer?"pointer":"default"}}><input type="checkbox" checked={!!checklistDone[c]} onChange={e=>{if(isIssuer){const updated={...checklistDone,[c]:e.target.checked};setChecklistDone(updated);sb.update(session.token,"permits",`id=eq.${permit.id}`,{form_data:{...fd,issuer_checklist:updated}}).catch(()=>{});}}} disabled={!isIssuer&&permit.status!=="active"} style={{width:"auto",marginTop:2,accentColor:B.accent}}/><span style={{fontSize:13,color:checklistDone[c]?B.accentBorder:B.text,lineHeight:1.5}}>{c}</span></label>))}
            {fd.selected_controls?.includes("RA Required")&&fd.ra_mode&&(<div style={{background:B.accentLight,borderRadius:8,padding:"10px",marginTop:8}}><p style={{fontSize:12,fontWeight:700,color:B.accentBorder,marginBottom:6}}>Risk Assessment — on-site verification</p>{fd.ra_mode==="upload"&&fd.ra_file_data&&<a href={fd.ra_file_data} download={fd.ra_file_name} style={{display:"inline-block",background:B.accent,color:"#fff",borderRadius:6,padding:"6px 14px",fontSize:12,fontWeight:600,textDecoration:"none"}}>View / Download RA</a>}{fd.ra_mode==="generate"&&fd.ra_generated&&<div style={{fontSize:11,maxHeight:200,overflowY:"auto",marginTop:6}} dangerouslySetInnerHTML={{__html:fd.ra_generated}}/>}</div>)}
            {isIssuer&&<div style={{marginTop:8,padding:"7px 10px",background:allChecked?B.accentLight:B.warnLight,borderRadius:6}}><p style={{fontSize:11,color:allChecked?B.accentBorder:B.warn,fontWeight:600}}>{allChecked?"✓ All controls verified on site — ready to issue":"⚠ "+checklistItems.filter(c=>!checklistDone[c]).length+" item(s) remaining"}</p></div>}
          </div>)}
        </Card>)}

        {permit.status==="rejected"&&fd.rejection_reason&&(<Card title="Rejection Reason"><p style={{fontSize:13,color:B.danger,lineHeight:1.6}}>{fd.rejection_reason}</p><p style={{fontSize:11,color:B.textSub,marginTop:4}}>By {fd.rejected_by||"—"} · {fmtDate(fd.rejected_at)}</p></Card>)}

        <p style={{fontSize:12,color:B.textSub,marginBottom:8,marginTop:4}}>Approval progress</p>
        {STAGES.map((s,i)=>{const sn=i+1,done=sn===1||(sn<=permit.stage&&sn>1)||(sn===4&&permit.status==="active"),cur=(sn===permit.stage+1&&permit.status==="pending"&&sn>1)||(sn===2&&permit.stage===1&&permit.status==="pending");return(<div key={s} style={{display:"flex",alignItems:"center",gap:10,background:done?B.accentLight:cur?B.warnLight:B.neutral,border:`0.5px solid ${done?B.accent:cur?B.warn:B.neutralBorder}`,borderRadius:8,padding:"8px 12px",marginBottom:6}}><div style={{width:20,height:20,borderRadius:"50%",flexShrink:0,background:done?B.accent:cur?B.warn:"#C0CAD5",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:"#fff",fontWeight:700}}>{done?"✓":sn}</div><div>
  <p style={{fontSize:12,fontWeight:600,color:done?B.accentBorder:cur?B.warn:B.textSub}}>{s}</p>
  <p style={{fontSize:10,color:done?B.accent:cur?B.warn:B.textSub}}>
    {done
      ? sn===1?"Submitted":sn===4?"Issued":"Approved & forwarded"
      : cur?"Awaiting approval":"Pending"}
  </p>
</div></div>);})}
      </>)}

      {tab==="audit"&&(<div><p style={{fontSize:12,color:B.textSub,marginBottom:10,fontWeight:500}}>Audit trail</p>{audit.length===0&&<p style={{fontSize:12,color:B.textSub}}>No activity yet.</p>}{audit.map((e,i)=>(<div key={e.id} style={{display:"flex",gap:10,marginBottom:10}}><div style={{display:"flex",flexDirection:"column",alignItems:"center",flexShrink:0}}><div style={{width:28,height:28,borderRadius:"50%",background:B.neutral,border:`0.5px solid ${B.neutralBorder}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:600,color:B.text}}>{(e.user_name||"?")[0]}</div>{i<audit.length-1&&<div style={{width:1,flex:1,background:B.neutralBorder,margin:"3px 0"}}/>}</div><div style={{paddingBottom:10,flex:1}}><div style={{display:"flex",justifyContent:"space-between"}}><p style={{fontSize:12,fontWeight:600,color:B.text}}>{e.action}</p><p style={{fontSize:10,color:B.textSub}}>{fmtDate(e.created_at)}</p></div><p style={{fontSize:11,color:B.textSub}}>{e.user_name} · {e.user_role}</p>{e.note&&<p style={{fontSize:11,color:B.danger,background:B.dangerLight,borderRadius:6,padding:"4px 8px",marginTop:3}}>{e.note}</p>}</div></div>))}</div>)}

      <div style={{display:"flex",flexDirection:"column",gap:8,marginTop:8}}>
        {showRejectBox&&(<div style={{background:B.dangerLight,border:`0.5px solid ${B.danger}`,borderRadius:8,padding:"1rem"}}><p style={{fontSize:12,fontWeight:600,color:B.danger,marginBottom:8}}>Reason for rejection *</p><textarea value={rejectReason} onChange={e=>setRejectReason(e.target.value)} placeholder="Provide clear reason…" rows={3} style={{marginBottom:8,borderColor:B.danger}}/><div style={{display:"flex",gap:8}}><button onClick={()=>action("reject")} disabled={busy||!rejectReason.trim()} style={{flex:1,background:B.danger,color:"#fff",border:"none",borderRadius:8,padding:"9px",fontSize:12,fontWeight:600,cursor:"pointer"}}>Confirm rejection</button><button onClick={()=>{setShowRejectBox(false);setRejectReason("");}} style={{flex:1,background:"transparent",border:`0.5px solid ${B.neutralBorder}`,borderRadius:8,padding:"9px",fontSize:12,cursor:"pointer",color:B.textSub}}>Cancel</button></div></div>)}
        {permit.status==="pending"&&permit.stage!==4&&permit.stage!==3&&!showRejectBox&&(session.profile.role==="admin"||(ROLE_STAGE[session.profile.role]===permit.stage&&session.profile.role!=="issuer"))&&(<div style={{display:"flex",gap:8}}><button onClick={()=>action("approve")} disabled={busy} style={{flex:1,background:busy?"#999":B.accent,color:"#fff",border:"none",borderRadius:8,padding:"10px",fontSize:12,fontWeight:600,cursor:busy?"not-allowed":"pointer"}}>{busy?"Processing…":"Approve & forward"}</button><button onClick={()=>setShowRejectBox(true)} disabled={busy} style={{flex:1,border:`0.5px solid ${B.danger}`,background:B.dangerLight,color:B.danger,borderRadius:8,padding:"10px",fontSize:12,cursor:"pointer"}}>Reject</button></div>)}
        {permit.status==="pending"&&(permit.stage===3||permit.stage===4)&&!showRejectBox&&(session.profile.role==="issuer"||session.profile.role==="admin")&&(<div style={{display:"flex",gap:8}}><button onClick={()=>action("issue")} disabled={busy||!allChecked} style={{flex:2,background:(busy||!allChecked)?"#999":B.accent,color:"#fff",border:"none",borderRadius:8,padding:"11px",fontSize:13,fontWeight:700,cursor:(busy||!allChecked)?"not-allowed":"pointer"}}>{busy?"Processing…":allChecked?"Issue permit":"Complete checklist first"}</button><button onClick={()=>setShowRejectBox(true)} disabled={busy} style={{flex:1,border:`0.5px solid ${B.danger}`,background:B.dangerLight,color:B.danger,borderRadius:8,padding:"10px",fontSize:12,cursor:"pointer"}}>Reject</button></div>)}
        {permit.status==="active"&&(<div style={{display:"flex",flexDirection:"column",gap:8}}>
  <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
    {canExtend&&!showExtForm&&<button onClick={()=>setShowExtForm(true)} disabled={busy} style={{flex:1,border:`0.5px solid ${B.warn}`,background:B.warnLight,color:B.warn,borderRadius:8,padding:"10px",fontSize:12,fontWeight:600,cursor:"pointer"}}>⟳ Extend permit ({MAX_EXT-(permit.extensions||0)} left)</button>}
    {(session.profile.role==="requester"||session.profile.role==="admin")&&<button onClick={()=>action("work_complete")} disabled={busy} style={{flex:1,border:`0.5px solid ${B.accentBorder}`,background:B.accentLight,color:B.accentBorder,borderRadius:8,padding:"10px",fontSize:12,fontWeight:600,cursor:"pointer"}}>✓ Work complete</button>}
    {(session.profile.role==="issuer"||session.profile.role==="admin")&&<button onClick={()=>action("suspend")} disabled={busy} style={{flex:1,border:`0.5px solid ${B.danger}`,background:B.dangerLight,color:B.danger,borderRadius:8,padding:"10px",fontSize:12,cursor:"pointer"}}>Suspend</button>}
    {(session.profile.role==="issuer"||session.profile.role==="admin")&&<button onClick={()=>action("close")} disabled={busy} style={{flex:1,border:`0.5px solid ${B.accentBorder}`,background:B.accentLight,color:B.accentBorder,borderRadius:8,padding:"10px",fontSize:12,cursor:"pointer"}}>Close permit</button>}
  </div>
  {showExtForm&&canExtend&&(
    <div style={{background:B.warnLight,border:`0.5px solid ${B.warn}`,borderRadius:10,padding:"1rem"}}>
      <p style={{fontSize:12,fontWeight:700,color:B.warn,marginBottom:8}}>⟳ Request Extension — set new end date</p>
      <p style={{fontSize:11,color:B.warn,marginBottom:10}}>Current end date: <strong>{fd.work_date_to||"Not set"}</strong> · Extensions used: {permit.extensions||0} / {MAX_EXT}</p>
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        <div style={{flex:1}}>
          <label style={{fontSize:11,color:B.textSub,display:"block",marginBottom:4}}>New end date *</label>
          <input type="date" value={extDateTo} onChange={e=>setExtDateTo(e.target.value)} min={new Date().toISOString().slice(0,10)} style={{borderColor:B.warn}}/>
        </div>
        <button onClick={()=>{if(!extDateTo){setErrMsg("Select a new end date.");return;}action("ext_request");setShowExtForm(false);}} disabled={busy||!extDateTo} style={{background:B.warn,color:"#fff",border:"none",borderRadius:8,padding:"10px 16px",fontSize:12,fontWeight:600,cursor:"pointer",marginTop:18}}>Submit extension</button>
        <button onClick={()=>setShowExtForm(false)} style={{background:"transparent",border:`0.5px solid ${B.neutralBorder}`,borderRadius:8,padding:"10px 12px",fontSize:12,cursor:"pointer",color:B.textSub,marginTop:18}}>Cancel</button>
      </div>
    </div>
  )}
</div>)}
{permit.status==="work_complete"&&(
  <div style={{display:"flex",flexDirection:"column",gap:8}}>
    <div style={{background:B.accentLight,border:`0.5px solid ${B.accent}`,borderRadius:8,padding:"10px 14px"}}>
      <p style={{fontSize:12,fontWeight:600,color:B.accentBorder}}>✓ Work In-charge has signed off completion</p>
      <p style={{fontSize:11,color:B.textSub,marginTop:3}}>Issuing Authority must now physically verify the area and formally close this permit.</p>
    </div>
    {(session.profile.role==="issuer"||session.profile.role==="admin")&&(
      <div style={{display:"flex",gap:8}}>
        <button onClick={()=>action("close")} disabled={busy} style={{flex:2,background:B.accent,color:"#fff",border:"none",borderRadius:8,padding:"11px",fontSize:13,fontWeight:700,cursor:"pointer"}}>✓ Area verified — Close permit</button>
        <button onClick={()=>action("suspend")} disabled={busy} style={{flex:1,border:`0.5px solid ${B.danger}`,background:B.dangerLight,color:B.danger,borderRadius:8,padding:"10px",fontSize:12,cursor:"pointer"}}>Suspend</button>
      </div>
    )}
  </div>
)}
        {permit.status==="extension_pending"&&(session.profile.role==="admin"||session.profile.role==="safety_officer")&&(<div style={{display:"flex",gap:8}}><button onClick={()=>action("ext_approve")} disabled={busy} style={{flex:1,background:B.accent,color:"#fff",border:"none",borderRadius:8,padding:"10px",fontSize:12,fontWeight:600,cursor:"pointer"}}>Approve extension</button><button onClick={()=>setShowRejectBox(true)} disabled={busy} style={{flex:1,border:`0.5px solid ${B.danger}`,background:B.dangerLight,color:B.danger,borderRadius:8,padding:"10px",fontSize:12,cursor:"pointer"}}>Reject</button></div>)}
        {(permit.status==="active"||permit.status==="closed")&&(<button onClick={()=>setShowPDF(true)} style={{width:"100%",background:B.primary,color:"#fff",border:"none",borderRadius:8,padding:"11px",fontSize:13,fontWeight:700,cursor:"pointer"}}>📄 Generate & Download Permit PDF</button>)}
      </div>
      {showPDF&&<PermitPDF permit={permit} audit={audit} orgName={session.org.name} orgLogo={session.org.logo||null} orgTemplate={session.org.pdf_template||"standard"} onClose={()=>setShowPDF(false)}/>}
    </div></div>
  );
}

// ── TASETI PDF Template ───────────────────────────────────────────────────────
function buildTASETIPdf(permit,fd,t,orgName,orgLogo,aaEntry,oshEntry,issuerEntry,completionEntry,closureEntry,qrContent,audit){
  const fmtD=(s)=>s?new Date(s).toLocaleDateString("en-GB"):"___________";
  const fmtT=(s)=>s||"___________";
  const dotline=(val,width)=>`<span style="display:inline-block;border-bottom:0.5px solid #000;min-width:${width||180}px;padding:0 4px">${val||""}</span>`;
  const checked=`<span style="font-size:14px">☑</span>`;
  const unchecked=`<span style="font-size:14px">☐</span>`;

  // Pre-compute extension section HTML
  const _auditArr=audit||[];
  const _extEntries=_auditArr.filter(function(a){return a.action&&a.action.toLowerCase().includes("extension");});
  const tasetExtHtml=(function(){
    if(!_extEntries.length&&!permit.extensions) return "";
    const maxExt=3;
    const extCount=permit.extensions||0;
    const lastNewEnd=fd.ext_requested_date?(" &nbsp;&middot;&nbsp; Last requested new end date: <b>"+new Date(fd.ext_requested_date).toLocaleDateString("en-GB")+"</b>"):"";
    const rows=_extEntries.map(function(e){
      const status=e.action.toLowerCase().includes("approved")
        ?"<span style='color:#0E9E6E;font-weight:700'>Approved</span>"
        :e.action.toLowerCase().includes("rejected")
          ?"<span style='color:#C0392B;font-weight:700'>Rejected</span>"
          :"<span style='color:#D97B00;font-weight:700'>Requested</span>";
      return "<tr>"
        +"<td style='font-size:9px;padding:3px 8px;border:0.5px solid #ddd;width:28%'>"+new Date(e.created_at).toLocaleString()+"</td>"
        +"<td style='font-size:9px;padding:3px 8px;border:0.5px solid #ddd;width:28%'>"+e.action+"</td>"
        +"<td style='font-size:9px;padding:3px 8px;border:0.5px solid #ddd;width:28%'>"+(e.user_name||"—")+" ("+(e.user_role||"—")+")</td>"
        +"<td style='font-size:9px;padding:3px 8px;border:0.5px solid #ddd;width:16%'>"+status+"</td>"
        +"</tr>";
    }).join("");
    const noRows=rows?"":"<tr><td colspan='4' style='color:#888;font-style:italic;font-size:9px;padding:4px 8px'>No extension history recorded</td></tr>";
    return "<div class='sec-head' style='margin-top:8px'>Extension Record</div>"
      +"<table><tr><td colspan='4' style='background:#f4f6f9;font-size:9px;padding:4px 8px;font-style:italic'>Extensions used: <b>"+extCount+"</b> of <b>"+maxExt+"</b> maximum allowed"+lastNewEnd+"</td></tr>"
      +"<tr style='background:#e8e8e8'>"
      +"<td style='font-size:9px;font-weight:700;padding:3px 8px;border:0.5px solid #ccc;width:28%'>Date / Time</td>"
      +"<td style='font-size:9px;font-weight:700;padding:3px 8px;border:0.5px solid #ccc;width:28%'>Action</td>"
      +"<td style='font-size:9px;font-weight:700;padding:3px 8px;border:0.5px solid #ccc;width:28%'>By (Role)</td>"
      +"<td style='font-size:9px;font-weight:700;padding:3px 8px;border:0.5px solid #ccc;width:16%'>Status</td>"
      +"</tr>"+rows+noRows+"</table>";
  })();

  // Build precautions checklist from selected controls
  const sel=fd.selected_controls||[];
  const allControls=(fd.osh_additional_controls?fd.osh_additional_controls.split("\n").filter(s=>s.trim()):[]);

  function ctrlTick(item){
    // Abass's requirement: all boxes blank for manual ticking on site
    return `${unchecked} ${item}`;
  }

  // Permit-type specific precautions matching TASETI forms
  const PRECAUTIONS={
    hot_work:[
      "Method Statement & Risk Assessment available","TBT Conducted, recorded and attached with this PTW",
      "Fire extinguisher (min 9kg dry powder) within 5m of work area","Hot work blanket / spark containment screen erected",
      "Fire watch assigned, briefed and stationed throughout work","All combustibles removed or shielded within 10m radius",
      "Welding / cutting equipment inspected and certified","Fire watch to remain 30 minutes after work completion",
      "Continuous gas monitoring for duration of work","Area barricaded and warning signs provided","Others:"
    ],
    cold_work:[
      "Risk Assessment available","Toolbox Talk (M)","Rescue Tripod","Controlled Access",
      "Protective Clothing","Top Man","Gas Test","Warning Signage (M)",
      "Eye Protection (M)","Fire Extinguisher","BA Set","Erect Barriers",
      "Ear Protection","Life Vest","Forced Ventilation","Standby Boat",
      "Protective Gloves (M)","Use of Radios","Safety Harness","Area Barricaded",
      "Scaff Tags","Display Permit (M)","Mech./Elec. Isolation","Others"
    ],
    confined_space:[
      "Gas test done and recorded","Required PPE is provided",
      "The area been fenced / cordoned off","Attendant is identified and deployed",
      "Proper illumination is provided","Entry/Exit log sheet available",
      "Traffic diversion signs is displayed","Respirator is available, if required",
      "All concerned persons been informed","Only trained personnel involved",
      "Enough ventilation is available / provided","TBT for the activity has been given",
      "Low voltage & flameproof lighting is arranged","Tripod availability","Others:"
    ],
    electrical:[
      "Risk Assessment available","Proper illumination been arranged",
      "TBT Conducted, recorded and attached with this PTW","Area cordon off and proper warning signage been displayed",
      "Sources of energy have been switched off","Unauthorised entry restricted",
      "Lockout/Tag out devices in place","PTW displayed",
      "Protective clothing worn by operatives","Ventilation required and provided",
      "Eye protection worn by operatives","Stand-by personnel required and provided",
      "Fire Extinguisher available","Others:"
    ],
    excavation:[
      "Is the Work Area Clearly Defined? Have the Latest work drawings been verified?",
      "NOC from relevant authorities where required has been obtained and copy available for evidence?",
      "Approved Method Statement and Risk Assessment Available and explained to the involved personnel?",
      "Has the Area been Scanned for Services with CAT Scanner and CAT Scan competent person sign in the highlighted drawing?",
      "Are All Service Locations Clearly Marked?","Has the Excavator been inspected and passed as fit to work?",
      "Arrangement for Light/Illumination provided for any proposed night work?",
      "If there are live underground utilities in the corridor, is there trial pit made?",
      "In presence of Live Underground Services, a signed Permit checklist for working near live utilities has been attached?",
      "Has the daily excavation inspection checklist been attached with this permit?",
      "Arrangements of Barricades, Signages and Warnings lights are available in excavation area?",
      "Excavation Design (Including structures, shoring/Benches/Slope/cross section made?"
    ],
    height:[
      "Risk Assessment available","Appropriate equipment is used for material shifting/handling",
      "TBT Conducted, recorded and attached with this PTW","Safety harness and life is provided and used by all personnel",
      "Barrication and warning signs on ground below work activity","Secured aluminium ladder is available",
      "No roof work shall be conducted if strong wind is blowing","Aluminium ladder access / CAT ladder is provided",
      "Edge protection is provided for unguarded roof edges","Trained personnel involved in the activity",
      "Work area is cleaned, tidy and has suitable work space","Others:"
    ],
    lifting:[
      "Equipment/lifting gear 3rd party certificates verified","Over head lines have been identified",
      "Equipment/lifting gears is checked for any damage","Lifting area is barricaded and warning signs provided",
      "Trained and certified Operator available","Lifting plan prepared and attached",
      "Trained and certified rigger available","Training/TBT has been conducted",
      "Applicable Third party certificates attached with PTW","Crane is positioned on firm and compacted ground",
      "Risk Assessment available","Nearest excavation is at least 1.5 meters away from crane","Others:"
    ],
    dewatering:[
      "Dewatering plan reviewed and approved","Pump capacity verified against inflow rate",
      "Discharge point identified and approved","Silt trap / sedimentation control installed",
      "Adjacent structures monitored for settlement","Excavation edges inspected after dewatering",
      "Pump electrical connections protected from water","Backup pump on standby",
      "Perimeter drainage channels clear of obstruction","Personnel exclusion during dewatering",
      "Water disposal documented and compliant","Emergency shutdown procedure tested",
      "Risk Assessment available","TBT Conducted and recorded","Others:"
    ],
    pressure_testing:[
      "Pressure test plan reviewed and approved","System isolated from all live energy sources",
      "Test medium confirmed — hydraulic preferred","Exclusion zone established and enforced",
      "Relief valve set and tagged — max 1.5× design pressure","Test equipment calibrated and certified",
      "Gradual pressurisation in steps — hold for inspection","Joints inspected at hold pressure",
      "Pressure gauge readable from safe distance","Depressurisation procedure defined before test",
      "Spill containment in place","Test documentation: date, medium, duration, result",
      "Risk Assessment available","TBT Conducted and recorded","Others:"
    ],
  };

  const precautions=PRECAUTIONS[permit.type]||sel;

  // Build precaution rows — 2 columns
  function precautionTable(items){
    let rows="";
    for(let i=0;i<items.length;i+=2){
      rows+=`<tr>
        <td style="padding:4px 8px;border:0.5px solid #999;width:50%;font-size:10px">${ctrlTick(items[i])}</td>
        <td style="padding:4px 8px;border:0.5px solid #999;width:50%;font-size:10px">${items[i+1]?ctrlTick(items[i+1]):"&nbsp;"}</td>
      </tr>`;
    }
    return `<table style="width:100%;border-collapse:collapse">${rows}</table>`;
  }

  // TASETI permit type colours — matching physical form colours
  const TASETI_COLORS={

function PermitPDF({permit,audit,orgName,orgLogo,orgTemplate,onClose}){
  const fd=permit.form_data||{};const t=pt(permit.type);
  const allControls=[...(fd.selected_controls||[]).filter(c=>c!=="RA Required"),...(fd.osh_additional_controls?fd.osh_additional_controls.split("\n").filter(s=>s.trim()):[])];
  const fmtD=(s)=>s?new Date(s).toLocaleDateString():"—";
  const fmtT=(s)=>s||"—";

  // Build 2-column control measures table rows
  function ctrlRows(items){
    const rows=[];
    for(let i=0;i<items.length;i+=2){
      rows.push(`<tr><td style="padding:5px 8px;border:0.5px solid #ccc;font-size:10px"><span style="color:#0E9E6E;font-weight:700;margin-right:6px">✓</span>${items[i]}</td><td style="padding:5px 8px;border:0.5px solid #ccc;font-size:10px">${items[i+1]?`<span style="color:#0E9E6E;font-weight:700;margin-right:6px">✓</span>${items[i+1]}`:" "}</td></tr>`);
    }
    return rows.join("");
  }

  // Audit entries by stage
  function auditFor(action){const e=audit.find(a=>a.action===action);return e?`${e.user_name} · ${new Date(e.created_at).toLocaleString()}`:"Pending";}
  function auditForRole(role){const e=audit.find(a=>a.action==="Approved & forwarded"&&a.user_role&&a.user_role.toLowerCase().includes(role.toLowerCase()));return e||null;}
  function auditIssued(){return audit.find(a=>a.action==="Permit issued")||null;}

  const typeColor = t.color||"#1A3A5C";
  const aaEntry = auditForRole("area authority")||auditForRole("admin");
  const oshEntry = auditForRole("osh")||auditForRole("safety");

                .pbar-title{color:#fff;font-size:13px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
                .btn-p{background:#0E9E6E;color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
                .btn-c{background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.35);border-radius:8px;padding:10px 14px;font-size:13px;cursor:pointer;white-space:nowrap;}
                .pcontent{padding:16px;}
                @media print{
                  .pbar{display:none!important;}
                  .pcontent{padding:0;}
                  @page{size:A4;margin:15mm;}
                  img{-webkit-print-color-adjust:exact;print-color-adjust:exact;display:block!important;}
                }
              </style>
            </head><body>
              <div class="pbar">
                <span class="pbar-title">📄 ${permit.permit_number}</span>
                <div style="display:flex;gap:8px;flex-shrink:0;">
                  <button class="btn-p" onclick="window.print()">🖨 Print / PDF</button>
                  <button class="btn-c" onclick="window.close()">✕ Close</button>
                </div>
              </div>
              <div class="pcontent">${printHtml}</div>
            </body></html>`);
            w.document.close();
            w.focus();
            onClose();
            let printed2=false;
            const doPrint2=()=>{if(printed2)return;printed2=true;setTimeout(()=>{try{w.print();}catch(e){}},300);};
            w.onload=()=>{
              const imgs=w.document.images;let loaded=0;const total=imgs.length;
              if(total===0){doPrint2();return;}
              const tryPrint=()=>{loaded++;if(loaded>=total)doPrint2();};
              for(let i=0;i<total;i++){if(imgs[i].complete){tryPrint();}else{imgs[i].onload=tryPrint;imgs[i].onerror=tryPrint;}}
            };
            if(w.document.readyState==="complete")setTimeout(doPrint2,1200);
          }
        }} style={{background:B.accent,color:"#fff",border:"none",borderRadius:8,padding:"8px 16px",fontSize:12,fontWeight:700,cursor:"pointer"}}>🖨 Print / Save as PDF</button>
          <button onClick={onClose} style={{background:"transparent",border:"0.5px solid rgba(255,255,255,0.3)",color:"#fff",borderRadius:8,padding:"8px 14px",fontSize:12,cursor:"pointer"}}>✕ Close</button>
        </div>
      </div>
      <div style={{flex:1,overflowY:"auto",background:"#fff",padding:"20px"}}>
        {previewHtml
          ? <div dangerouslySetInnerHTML={{__html:previewHtml}}/>
          : <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100%",color:"#888",fontSize:14}}>⏳ Preparing document…</div>
        }
      </div>
    </div>
  );
}

  useEffect(()=>{load();},[]);

  async function readNote(n){if(!n.is_read){await sb.update(session.token,"notifications",`id=eq.${n.id}`,{is_read:true});setNotes(p=>p.map(x=>x.id===n.id?{...x,is_read:true}:x));if(onUnreadChange)onUnreadChange(notes.filter(x=>!x.is_read&&x.id!==n.id).length);}if(n.permit_id){const ps=await sb.select(session.token,"permits",`id=eq.${n.permit_id}`);if(Array.isArray(ps)&&ps[0])onSelectPermit(ps[0]);}}

// ── PTW Register ──────────────────────────────────────────────────────────────
const PERMIT_CODES = {
  hot_work:"HW", cold_work:"CW", confined_space:"CS",
  electrical:"LO", height:"WH", excavation:"EX", lifting:"LF",
  dewatering:"DW", pressure_testing:"PT"
};
const PERMIT_ICONS = {
  hot_work:"🔥", cold_work:"📋", confined_space:"⚠️",
  electrical:"🔒", height:"🏗️", excavation:"⛏️", lifting:"🏋️",
  dewatering:"💧", pressure_testing:"🔴"
};

function Register({session,permits,onBack}){
  const sector=session&&session.org&&session.org.sector;
  const allTypes=getPermitTypes(sector);

  // Active tab = first permit type with data, or first type
  const[activeTab,setActiveTab]=useState(()=>allTypes[0]&&allTypes[0].id);
  const[downloading,setDownloading]=useState(false);

  // Keep activeTab valid when sector changes
  React.useEffect(()=>{ if(!allTypes.find(t=>t.id===activeTab))setActiveTab(allTypes[0]&&allTypes[0].id); },[sector]);

  const tabPermits=permits.filter(p=>p.type===activeTab);
  const activeType=allTypes.find(t=>t.id===activeTab)||{label:activeTab,color:"#1A3A5C",id:activeTab};
  const code=PERMIT_CODES[activeTab]||activeTab.toUpperCase().slice(0,2);

  const filtered=tabPermits; // alias kept for stats block below

  const stats={
    total:permits.length,
    active:permits.filter(p=>p.status==="active").length,
    closed:permits.filter(p=>p.status==="closed").length,
    pending:permits.filter(p=>p.status==="pending").length,
    revoked:permits.filter(p=>p.status==="revoked").length,
  };

  function fmtDate(s){return s?new Date(s).toLocaleDateString("en-GB"):"—";}
  function fmtTime(s){return s?new Date(s).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}):"—";}
  function statusBadgeColor(s){return{active:"#0E9E6E",pending:"#D97B00",closed:"#5A6A7A",revoked:"#C0392B",work_complete:"#185FA5",rejected:"#C0392B",extension_pending:"#7F77DD"}[s]||"#5A6A7A";}

  // Generate PDF — opens in new window preserving in-app look and feel
  async function downloadXLSX(){
    setDownloading(true);
    try {
      if(typeof ExcelJS==="undefined"){ alert("Excel library not loaded. Please check your internet connection and refresh."); setDownloading(false); return; }
      const orgName = session.org.name;
      const coordinator = session.profile.full_name;
      const now = new Date().toLocaleString("en-GB");
      const TYPES=allTypes.map(t=>({...t,code:PERMIT_CODES[t.id]||t.id.toUpperCase().slice(0,2)}));

      function fmtD(s){return s?new Date(s).toLocaleDateString("en-GB"):"";}
      function fmtT(s){return s?new Date(s).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}):"";}
      function statusLabel(s){
        if(s==="active")return"Open";
        if(s==="closed")return"Closed";
        if(s==="revoked")return"Revoked";
        return(s||"").replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase());
      }
      // Strip # and return ARGB (ExcelJS uses ARGB)
      function toARGB(hex){ return "FF"+hex.replace("#",""); }
      // Lighten a hex colour by mixing with white at pct (0–1)
      function lighten(hex,pct){
        let h=hex.replace("#","");
        const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
        const mix=(c)=>Math.round(c+(255-c)*pct).toString(16).padStart(2,"0");
        return "#"+mix(r)+mix(g)+mix(b);
      }
      // Status fill colours
      const STATUS_FILL={
        Open:   {argb:"FF1A7D44"},  // dark green
        Closed: {argb:"FF555555"},  // grey
        Revoked:{argb:"FF9B1C1C"},  // dark red
      };

      const wb = new ExcelJS.Workbook();
      wb.creator = coordinator;
      wb.company = orgName;
      wb.created = new Date();

      // ── SUMMARY sheet ──────────────────────────────────────────────
      const wsSummary = wb.addWorksheet("Summary");
      wsSummary.columns=[
        {width:36},{width:8},{width:8},{width:8},{width:8},{width:8},{width:11}
      ];

      // Title row
      wsSummary.addRow(["CONTROLIT — Permit to Work Log Register"]);
      wsSummary.mergeCells("A1:G1");
      const titleCell=wsSummary.getCell("A1");
      titleCell.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF1A3A5C"}};
      titleCell.font={bold:true,color:{argb:"FFFFFFFF"},size:13};
      titleCell.alignment={vertical:"middle",horizontal:"center"};
      wsSummary.getRow(1).height=24;

      // Meta rows
      const metaStyle={font:{size:10},fill:{type:"pattern",pattern:"solid",fgColor:{argb:"FFF0F4F8"}}};
      [["Organisation:", orgName],["Coordinator:", coordinator],["Generated:", now],["Reference:", "HSE-PTW-002 Rev 00"]].forEach(arr=>{
        const r=wsSummary.addRow(arr);
        r.eachCell(c=>{c.fill=metaStyle.fill;c.font=metaStyle.font;});
        r.getCell(1).font={...metaStyle.font,bold:true};
      });
      wsSummary.addRow([]);

      // Header row
      const summHdr=wsSummary.addRow(["Permit Type","Code","Total","Open","Closed","Revoked","Extended"]);
      summHdr.eachCell(c=>{
        c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF1A3A5C"}};
        c.font={bold:true,color:{argb:"FFFFFFFF"},size:10};
        c.alignment={horizontal:"center",vertical:"middle"};
        c.border={bottom:{style:"thin",color:{argb:"FF93C5FD"}}};
      });
      summHdr.getCell(1).alignment={horizontal:"left",vertical:"middle"};
      wsSummary.getRow(7).height=18;

      // Data rows — each permit type coloured with its own colour
      TYPES.forEach((t,i)=>{
        const tp=permits.filter(p=>p.type===t.id);
        const row=wsSummary.addRow([
          t.label, t.code,
          tp.length,
          tp.filter(p=>p.status==="active").length,
          tp.filter(p=>p.status==="closed").length,
          tp.filter(p=>p.status==="revoked").length,
          tp.filter(p=>(p.extensions||0)>0).length,
        ]);
        const bgARGB=toARGB(lighten(t.color,0.82));
        row.eachCell(c=>{
          c.fill={type:"pattern",pattern:"solid",fgColor:{argb:bgARGB}};
          c.font={size:10};
          c.alignment={horizontal:"center"};
        });
        row.getCell(1).font={size:10,bold:true,color:{argb:toARGB(t.color)}};
        row.getCell(1).alignment={horizontal:"left"};

    {key:"closed",   label:"Date Closed",            w:88,  align:"center"},
    {key:"closeTime",label:"Close-out Time",         w:70,  align:"center"},
    {key:"ext",      label:"Extended? (Y/N)",        w:80,  align:"center"},
    {key:"susp",     label:"Suspended? (Y/N)",       w:80,  align:"center"},
    {key:"status",   label:"Closure Status",         w:90,  align:"center"},
    {key:"nc",       label:"Non-Compliance?",        w:85,  align:"center"},
    {key:"remarks",  label:"Remarks",                w:130, align:"left"},
  ];

  function cellVal(p,key){
    const fd=p.form_data||{};
    const extended=(p.extensions||0)>0;
    const suspended=p.status==="revoked";
    switch(key){
      case"sn":      return null; // rendered separately
      case"ref":     return p.permit_number||"";
      case"authority":return fd.permit_authority||fd.area_authority||p.authority_name||"";
      case"issuer":  return fd.permit_issuer||p.issuer_name||"";
      case"holder":  return p.requester_name||"";
      case"desc":    return p.title||"";
      case"location":return p.area||"";
      case"tra":     return fd.tra_ref||"";
      case"ms":      return fd.ms_ref||"";
      case"issued":  return fmtDate(p.issued_at||p.created_at);
      case"start":   return fd.work_time_from||"";
      case"closed":  return p.closed_at?fmtDate(p.closed_at):"";
      case"closeTime":return p.closed_at?fmtTime(p.closed_at):"";
      case"ext":     return extended?"Y":"N";
      case"susp":    return suspended?"Y":"N";
      case"status":  return p.status==="active"?"Open":p.status==="closed"?"Closed":p.status==="revoked"?"Revoked":(p.status||"").replace(/_/g," ");
      case"nc":      return fd.non_compliance||"";
      case"remarks": return fd.remarks||"";
      default:       return "";
    }
  }

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100vh",overflow:"hidden",background:"#F0F2F5"}}>
      <Topbar title="PTW Register" onBack={onBack} right={
        <div style={{display:"flex",gap:6}}>
          <button onClick={downloadXLSX} disabled={downloading} style={{border:"0.5px solid rgba(255,255,255,0.3)",background:"#0E9E6E",color:"#fff",borderRadius:6,padding:"6px 14px",fontSize:11,cursor:downloading?"not-allowed":"pointer",fontWeight:700}}>
            {downloading?"Generating…":"⬇ Excel (.xlsx)"}
          </button>
          <button onClick={downloadPDF} disabled={downloading} style={{border:"0.5px solid rgba(255,255,255,0.3)",background:"rgba(255,255,255,0.1)",color:"#fff",borderRadius:6,padding:"6px 14px",fontSize:11,cursor:downloading?"not-allowed":"pointer",fontWeight:600}}>
            🖨 PDF
          </button>
        </div>
      }/>

      {/* Org header bar */}
      <div style={{background:"#1A3A5C",color:"#fff",padding:"6px 16px",fontSize:11,display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:"1px solid rgba(255,255,255,0.12)"}}>
        <span style={{fontWeight:700,letterSpacing:0.4}}>{session.org.name} — Permit to Work Log Register</span>
        <span style={{opacity:0.6,fontSize:10}}>Coordinator: {session.profile.full_name} · HSE-PTW-002</span>
      </div>

      {/* Summary stats strip */}
      <div style={{background:"#fff",borderBottom:"1px solid #D8DEE6",padding:"6px 16px",display:"flex",gap:16,fontSize:11}}>
        {[["Total",permits.length,"#1A3A5C"],["Active",permits.filter(p=>p.status==="active").length,"#0E9E6E"],["Pending",permits.filter(p=>p.status==="pending"||p.status==="extension_pending").length,"#D97B00"],["Closed",permits.filter(p=>p.status==="closed").length,"#5A6A7A"],["Revoked",permits.filter(p=>p.status==="revoked").length,"#C0392B"]].map(([l,v,c])=>(
          <div key={l} style={{display:"flex",alignItems:"center",gap:5}}>
            <span style={{fontWeight:700,color:c,fontSize:14}}>{v}</span>
            <span style={{color:"#7A8AA0",fontSize:10}}>{l}</span>
            <span style={{color:"#D8DEE6",marginLeft:4}}>|</span>
          </div>
        ))}
        <span style={{color:"#7A8AA0",fontSize:10,marginLeft:"auto",alignSelf:"center"}}>{tabPermits.length} on this sheet</span>
      </div>

      {/* Sheet tabs — Excel style */}
      <div style={{background:"#E8EBF0",borderBottom:"2px solid #C8CDD8",display:"flex",overflowX:"auto",padding:"0 8px",gap:0,flexShrink:0}}>
        {allTypes.map(t=>{
          const count=permits.filter(p=>p.type===t.id).length;
          const isActive=activeTab===t.id;
          return(
            <button key={t.id} onClick={()=>setActiveTab(t.id)}
              style={{
                border:"none",borderTop:`3px solid ${isActive?t.color:"transparent"}`,
                background:isActive?"#fff":"transparent",
                color:isActive?t.color:"#5A6A7A",
                padding:"7px 14px 6px 14px",
                fontSize:11,fontWeight:isActive?700:500,
                cursor:"pointer",
                whiteSpace:"nowrap",
                borderRight:"1px solid #C8CDD8",
                marginBottom:isActive?"-2px":0,
                borderBottom:isActive?"2px solid #fff":"none",
                position:"relative",
                zIndex:isActive?2:1,
                transition:"all 0.1s",
                display:"flex",gap:5,alignItems:"center",
              }}>
              <span>{PERMIT_ICONS[t.id]||"📄"}</span>
              <span>{t.label.split("(")[0].trim()}</span>
              {count>0&&<span style={{background:isActive?t.color+"22":"#E0E4EA",color:isActive?t.color:"#7A8AA0",borderRadius:10,padding:"0 5px",fontSize:9,fontWeight:700}}>{count}</span>}
            </button>
          );
        })}
      </div>

      {/* Sheet name bar — mimics Excel sheet header row */}
      <div style={{background:activeType.color,color:"#fff",padding:"5px 16px",fontSize:11,fontWeight:700,display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
        <span>{PERMIT_ICONS[activeTab]||"📄"} {activeType.label.toUpperCase()} PERMIT LOG</span>
        <span style={{opacity:0.7,fontWeight:400,fontSize:10}}>Code: {code} · {session.org.name} · ADOSH-SF: CoP 21.0</span>
      </div>

      {/* Spreadsheet body — horizontally and vertically scrollable */}
      <div style={{flex:1,overflow:"auto",background:"#fff"}}>
        <table style={{borderCollapse:"collapse",tableLayout:"fixed",minWidth:COLS.reduce((a,c)=>a+c.w,0)}}>
          {/* Frozen column header row */}
          <thead>
            <tr style={{background:"#1A3A5C",position:"sticky",top:0,zIndex:10}}>
              {COLS.map(col=>(
                <th key={col.key} style={{
                  width:col.w,minWidth:col.w,
                  padding:"7px 8px",
                  color:"#fff",fontSize:10,fontWeight:700,
                  textAlign:col.align,
                  borderRight:"1px solid rgba(255,255,255,0.12)",
                  whiteSpace:"normal",lineHeight:1.25,
                  letterSpacing:0.2,
                }}>{col.label}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {tabPermits.length===0&&(
              <tr>
                <td colSpan={COLS.length} style={{padding:"3rem",textAlign:"center",color:"#7A8AA0",fontSize:13,background:"#FAFBFC"}}>
                  <div style={{fontSize:28,marginBottom:8}}>📋</div>
                  <div style={{fontWeight:600}}>No permits recorded for {activeType.label}</div>
                  <div style={{fontSize:11,marginTop:4,opacity:0.7}}>Permits issued under this type will appear here</div>
                </td>
              </tr>
            )}
            {tabPermits.map((p,idx)=>{
              const fd=p.form_data||{};
              const extended=(p.extensions||0)>0;
              const suspended=p.status==="revoked";
              const statusVal=cellVal(p,"status");
              const isEven=idx%2===0;
              const rowBg=isEven?"#fff":"#F7F9FB";
              return(
                <tr key={p.id} style={{background:rowBg,borderBottom:"1px solid #E8ECF2"}}>
                  {COLS.map(col=>{
                    if(col.key==="sn"){
                      return <td key="sn" style={{padding:"6px 8px",textAlign:"center",color:"#9AA4B2",fontSize:10,borderRight:"1px solid #E8ECF2",background:isEven?"#F7F9FB":"#EEF1F6",fontWeight:600}}>{idx+1}</td>;
                    }
                    if(col.key==="ref"){
                      return <td key="ref" style={{padding:"6px 8px",fontWeight:700,color:activeType.color,fontSize:11,borderRight:"1px solid #E8ECF2",whiteSpace:"nowrap"}}>
                        {p.permit_number}
                        {extended&&<span style={{background:activeType.color+"22",color:activeType.color,border:`0.5px solid ${activeType.color}`,borderRadius:4,padding:"1px 5px",fontSize:8,fontWeight:800,marginLeft:5}}>+EXT</span>}
                      </td>;
                    }
                    if(col.key==="ext"){
                      return <td key="ext" style={{padding:"6px 8px",textAlign:"center",fontWeight:700,color:extended?"#D97B00":"#9AA4B2",fontSize:11,borderRight:"1px solid #E8ECF2"}}>{extended?"Y":"N"}</td>;
                    }
                    if(col.key==="susp"){
                      return <td key="susp" style={{padding:"6px 8px",textAlign:"center",fontWeight:700,color:suspended?"#C0392B":"#9AA4B2",fontSize:11,borderRight:"1px solid #E8ECF2"}}>{suspended?"Y":"N"}</td>;
                    }
                    if(col.key==="status"){
                      const sc=statusBadgeColor(p.status);
                      return <td key="status" style={{padding:"6px 8px",textAlign:"center",borderRight:"1px solid #E8ECF2"}}>
                        <span style={{background:sc+"22",color:sc,border:`0.5px solid ${sc}`,borderRadius:10,padding:"2px 8px",fontSize:10,fontWeight:700}}>{statusVal}</span>
                      </td>;
                    }
                    if(col.key==="nc"){
                      const hasNC=!!cellVal(p,"nc");
                      return <td key="nc" style={{padding:"6px 8px",textAlign:"center",color:hasNC?"#C0392B":"#9AA4B2",fontWeight:hasNC?700:400,fontSize:11,borderRight:"1px solid #E8ECF2"}}>{hasNC?"Y":"N"}</td>;
                    }
                    const val=cellVal(p,col.key);
                    return <td key={col.key} style={{
                      padding:"6px 8px",
                      fontSize:10,
                      color:val?"#1A2B3C":"#B0B8C4",
                      borderRight:"1px solid #E8ECF2",
                      textAlign:col.align,
                      overflow:"hidden",
                      textOverflow:"ellipsis",
                      whiteSpace:col.key==="desc"||col.key==="remarks"?"normal":"nowrap",
                      maxWidth:col.w,
                    }}>{val||"—"}</td>;
                  })}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {/* Bottom status bar — Excel style */}
      <div style={{background:"#E8EBF0",borderTop:"1px solid #C8CDD8",padding:"3px 16px",fontSize:10,color:"#5A6A7A",display:"flex",gap:16,alignItems:"center",flexShrink:0}}>
        <span>Sheet: <strong style={{color:activeType.color}}>{activeType.label}</strong></span>
        <span>Records: <strong>{tabPermits.length}</strong></span>
        <span>Extended: <strong style={{color:"#D97B00"}}>{tabPermits.filter(p=>(p.extensions||0)>0).length}</strong></span>
        <span>Open: <strong style={{color:"#0E9E6E"}}>{tabPermits.filter(p=>p.status==="active").length}</strong></span>
        <span>Closed: <strong>{tabPermits.filter(p=>p.status==="closed").length}</strong></span>
      </div>
    </div>
  );
}

// ── App Root ──────────────────────────────────────────────────────────────────
function App(){
  const[session,setSession]=useState(()=>{
    // Restore session from sessionStorage if available (prevents logout after PDF print on mobile)
    try{
      const saved=sessionStorage.getItem("controlit_session");
      if(saved)return JSON.parse(saved);
    }catch(e){}
    return null;
  });const[screen,setScreen]=useState("dashboard");const[permits,setPermits]=useState([]);const[selected,setSelected]=useState(null);const[loading,setLoading]=useState(false);const[error,setError]=useState("");const[setupDone,setSetupDone]=useState(false);const[unread,setUnread]=useState(0);
  const fetchPermits=useCallback(async()=>{if(!session)return;setLoading(true);setError("");try{const d=await sb.select(session.token,"permits","order=created_at.desc");if(Array.isArray(d))setPermits(d);else setError("Failed to load permits.");}catch(e){setError("Connection error.");}setLoading(false);},[session]);
  const fetchUnread=useCallback(async()=>{if(!session)return;try{const d=await sb.select(session.token,"notifications",`user_id=eq.${session.userId}&is_read=eq.false&select=id`);if(Array.isArray(d))setUnread(d.length);}catch(e){}},[session]);

  // Permit expiry check — runs after permits load
  // Marks active permits as expired if work_date_to has passed (with 24hr grace)
  const checkExpiry=useCallback(async(loadedPermits)=>{
    if(!session||!loadedPermits)return;
    const now=new Date();
    const grace=24*60*60*1000; // 24 hours grace period
    const toExpire=loadedPermits.filter(p=>{
      if(p.status!=="active")return false;
      const fd=p.form_data||{};
      if(!fd.work_date_to)return false;
      const endDate=new Date(fd.work_date_to);
      endDate.setHours(23,59,59,999); // end of work_date_to day
      return (now-endDate)>grace; // expired more than 24hrs ago
    });
    if(toExpire.length===0)return;
    for(const p of toExpire){
      await sb.update(session.token,"permits",`id=eq.${p.id}`,{status:"expired"});
      await sb.insert(session.token,"permit_audit",{org_id:p.org_id,permit_id:p.id,user_id:session.userId,user_name:"System",user_role:"Auto-expiry",action:"Permit auto-expired",note:`Work end date ${p.form_data?.work_date_to} passed. Permit expired automatically.`});
      await sb.notify(session.token,p.org_id,p.id,p.permit_number,p.title,"closed","System (Auto-expiry)");
    }
    if(toExpire.length>0)await fetchPermits();
  },[session,fetchPermits]);
  useEffect(()=>{fetchPermits();},[fetchPermits]);useEffect(()=>{fetchUnread();},[fetchUnread]);useEffect(()=>{if(permits.length>0)checkExpiry(permits);},[permits]);

  // QR verification handled by verify.html — no in-app URL param needed

  // Refresh when tab becomes visible — no continuous polling
  useEffect(()=>{
    function onVisible(){
      if(document.visibilityState==="visible"&&session){
        fetchPermits();
        fetchUnread();
      }
    }
    document.addEventListener("visibilitychange",onVisible);
    return ()=>document.removeEventListener("visibilitychange",onVisible);
  },[session,fetchPermits,fetchUnread]);
  if(!session)return <Login onLogin={s=>setSession(s)}/>;
  if(session.firstTime&&!setupDone)return <AccountSetup session={session} onComplete={s=>{setSession(s);setSetupDone(true);}}/>;
  async function logout(){await sb.signOut(session.token);setSession(null);setPermits([]);setScreen("dashboard");setSetupDone(false);}
  function sel(p){setSelected(p);setScreen("detail");}
  return(<div style={{minHeight:"100vh",background:"linear-gradient(160deg,#0A1520 0%,#0F1F2E 50%,#0A2018 100%)"}}>
    {screen==="dashboard"&&<Dashboard session={session} permits={permits} loading={loading} error={error} onSelect={sel} onNew={()=>setScreen("new")} onNotifs={()=>setScreen("notifs")} unread={unread} onAdmin={()=>setScreen("admin")} onWorkflow={()=>setScreen("workflow")} onRegister={()=>setScreen("register")} onChangePass={()=>setScreen("changepass")} onLogout={logout}/>}
    {screen==="detail"&&selected&&<PermitDetail permit={selected} session={session} onBack={()=>{fetchPermits();fetchUnread();setScreen("dashboard");}} onRefresh={async()=>{await fetchPermits();await fetchUnread();}}/>}
    {screen==="new"&&<NewPermit session={session} onBack={()=>setScreen("dashboard")} onSuccess={()=>{fetchPermits();fetchUnread();setScreen("dashboard");}}/>}
    {screen==="notifs"&&<Notifs session={session} onBack={()=>{fetchUnread();setScreen("dashboard");}} onSelectPermit={p=>{setSelected(p);setScreen("detail");}} onUnreadChange={setUnread}/>}
    {screen==="admin"&&<Admin session={session} onBack={()=>setScreen("dashboard")}/>}
    {screen==="changepass"&&<ChangePassword session={session} onBack={()=>setScreen("dashboard")}/>}
    {screen==="register"&&<Register session={session} permits={permits} onBack={()=>setScreen("dashboard")}/>}
    {screen==="workflow"&&(<div><Topbar title="Permit Workflow" onBack={()=>setScreen("dashboard")}/><div style={{padding:"1.25rem"}}>{STAGES.map((s,i)=>(<div key={s} style={{display:"flex",gap:12,alignItems:"flex-start",marginBottom:16}}><div style={{width:32,height:32,borderRadius:"50%",background:B.primary,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:13,flexShrink:0}}>{i+1}</div><div style={{background:B.neutral,borderRadius:8,padding:"10px 14px",flex:1}}><p style={{fontSize:13,fontWeight:600,color:B.text}}>{s}</p><p style={{fontSize:11,color:B.textSub,marginTop:2}}>{["Submits permit with control measures, tools & equipment, and risk assessment (upload or AI-generated 5x5 matrix)","Reviews all requester inputs — confirms area readiness, approves or rejects with reason","Reviews HSE compliance, adds additional controls with AI assist, approves or rejects — checklist auto-generated","Verifies all controls on site via checklist, issues permit — formal PTW document generated for download"][i]}</p></div></div>))}</div></div>)}
  </div>);
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
